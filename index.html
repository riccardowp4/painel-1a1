<!doctype html>

<div id="auth" class="wrap"><p class="hint" style="text-align:center;margin-top:60px">Carregando…</p></div>
<div id="publico" class="wrap" hidden></div>
<div id="master" hidden>
<div class="wrap">
  <header class="top">

      <h1>Painel de 1:1</h1>

    </div>
    <button class="btn sec" id="sair">Sair</button>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="geral" aria-selected="true">Visão geral</button>
    <button role="tab" data-tab="pessoas" aria-selected="false">Pessoas</button>

    <button role="tab" data-tab="historico" aria-selected="false">Histórico</button>
  </nav>
  <section id="tab-geral"></section>
  <section id="tab-pessoas" hidden></section>
  <section id="tab-agenda" hidden></section>
  <section id="tab-roteiros" hidden></section>
  <section id="tab-clima" hidden></section>
  <section id="tab-kpis" hidden></section>
  <section id="tab-acessos" hidden></section>
  <section id="tab-historico" hidden></section>
</div>
</div>
<dialog class="ficha" id="ficha" aria-label="Ficha individual"></dialog>
<dialog class="ficha" id="previa" aria-label="Como a pessoa vê a página"></dialog>
<div id="tip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
